#
# WARNING: To install UniversalPhotos, follow our guide: https://docs./install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/yashhasan570/UniversalPhotos/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

# For development see:
# - https://docs./developer/setup
# - https://docs./developer/troubleshooting

name: universal_photos-dev

services:
  universal_photos-app-base:
    profiles: ['_base']
    tmpfs:
      - /tmp
    volumes:
      - ..:/usr/src/app
      # - ../../ui:/usr/src/ui
      - build_cache:/buildcache
      - server_node_modules:/usr/src/app/server/node_modules
      - web_node_modules:/usr/src/app/web/node_modules
      - github_node_modules:/usr/src/app/.github/node_modules
      - cli_node_modules:/usr/src/app/packages/cli/node_modules
      - docs_node_modules:/usr/src/app/docs/node_modules
      - e2e_node_modules:/usr/src/app/e2e/node_modules
      - sdk_node_modules:/usr/src/app/packages/sdk/node_modules
      - app_node_modules:/usr/src/app/node_modules
      - sveltekit:/usr/src/app/web/.svelte-kit
      - coverage:/usr/src/app/web/coverage

  universal_photos-init:
    extends:
      service: universal_photos-app-base
    profiles: !reset []
    container_name: universal_photos_init
    image: universal_photos-server-dev:latest
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    command:
      - |
        mise install
        touch /tmp/init-complete
        exec tail -f /dev/null
    volumes:
      - build_cache:/buildcache
    restart: 'no'
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/init-complete']
      interval: 2s
      timeout: 3s
      retries: 300
      start_period: 300s

  universal_photos-server:
    extends:
      service: universal_photos-app-base
    profiles: !reset []
    container_name: universal_photos_server
    command: ['universal_photos-dev']
    image: universal_photos-server-dev:latest
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION}/photos:/data
      - /etc/localtime:/etc/localtime:ro
      - ../packages/plugin-core:/build/plugins/universal_photos-plugin-core
    env_file:
      - .env
    environment:
      UNIVERSALPHOTOS_REPOSITORY: universal_photos-app/universal_photos
      UNIVERSALPHOTOS_REPOSITORY_URL: https://github.com/yashhasan570/UniversalPhotos
      UNIVERSALPHOTOS_SOURCE_REF: local
      UNIVERSALPHOTOS_SOURCE_COMMIT: af2efbdbbddc27cd06142f22253ccbbbbeec1f55
      UNIVERSALPHOTOS_SOURCE_URL: https://github.com/yashhasan570/UniversalPhotos/commit/af2efbdbbddc27cd06142f22253ccbbbbeec1f55
      UNIVERSALPHOTOS_BUILD: '9654404849'
      UNIVERSALPHOTOS_BUILD_URL: https://github.com/yashhasan570/UniversalPhotos/actions/runs/9654404849
      UNIVERSALPHOTOS_BUILD_IMAGE: development
      UNIVERSALPHOTOS_BUILD_IMAGE_URL: https://github.com/yashhasan570/UniversalPhotos/pkgs/container/universal_photos-server
      UNIVERSALPHOTOS_THIRD_PARTY_SOURCE_URL: https://github.com/yashhasan570/UniversalPhotos/
      UNIVERSALPHOTOS_THIRD_PARTY_BUG_FEATURE_URL: https://github.com/yashhasan570/UniversalPhotos/issues
      UNIVERSALPHOTOS_THIRD_PARTY_DOCUMENTATION_URL: https://docs.
      UNIVERSALPHOTOS_THIRD_PARTY_SUPPORT_URL: https://docs./community-guides
      UNIVERSALPHOTOS_HELMET_FILE: 'true'
    ports:
      - 9230:9230
      - 9231:9231
      - 2283:2283
    depends_on:
      universal_photos-init:
        condition: service_healthy
      redis:
        condition: service_started
      database:
        condition: service_started
    healthcheck:
      disable: false

  universal_photos-web:
    extends:
      service: universal_photos-app-base
    profiles: !reset []
    container_name: universal_photos_web
    image: universal_photos-web-dev:latest
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    command: ['universal_photos-web']
    env_file:
      - .env
    ports:
      - 3000:3000
      - 24678:24678
    restart: unless-stopped
    depends_on:
      universal_photos-init:
        condition: service_healthy
      universal_photos-server:
        condition: service_started

  universal_photos-machine-learning:
    container_name: universal_photos_machine_learning
    image: universal_photos-machine-learning-dev:latest
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    build:
      context: ../machine-learning
      dockerfile: Dockerfile
      args:
        - DEVICE=cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    ports:
      - 3003:3003
    volumes:
      - ../machine-learning/universal_photos_ml:/usr/src/universal_photos_ml
      - model_cache:/cache
    env_file:
      - .env
    depends_on:
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: universal_photos_redis
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    container_name: universal_photos_postgres
    image: ghcr.io/universal_photos-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${UPLOAD_LOCATION}/postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    shm_size: 128mb
    healthcheck:
      disable: false
  # set UNIVERSALPHOTOS_TELEMETRY_INCLUDE=all in .env to enable metrics
  # universal_photos-prometheus:
  #   container_name: universal_photos_prometheus
  #   ports:
  #     - 9090:9090
  #   image: prom/prometheus
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus

  # first login uses admin/admin
  # add data source for http://universal_photos-prometheus:9090 to get started
  # universal_photos-grafana:
  #   container_name: universal_photos_grafana
  #   command: ['./run.sh', '-disable-reporting']
  #   ports:
  #     - 3000:3000
  #   image: grafana/grafana:10.3.3-ubuntu
  #   volumes:
  #     - grafana_data:/var/lib/grafana

volumes:
  model_cache:
  prometheus_data:
  grafana_data:
  build_cache:
  server_node_modules:
  web_node_modules:
  github_node_modules:
  cli_node_modules:
  docs_node_modules:
  e2e_node_modules:
  sdk_node_modules:
  app_node_modules:
  sveltekit:
  coverage:
