name: universal_photos-e2e

services:
  universal_photos-app-base:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: universal_photos-app-base

  universal_photos-init:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: universal_photos-init
    container_name: universal_photos-e2e-init

  universal_photos-server:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: universal_photos-server
    container_name: universal_photos-e2e-server
    ports: !reset []
    env_file: !reset []
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: universal_photos
      UNIVERSALPHOTOS_MACHINE_LEARNING_ENABLED: 'false'
      UNIVERSALPHOTOS_TELEMETRY_INCLUDE: all
      UNIVERSALPHOTOS_ENV: testing
      UNIVERSALPHOTOS_PORT: '2285'
      UNIVERSALPHOTOS_IGNORE_MOUNT_CHECK_ERRORS: 'true'
    volumes:
      - ./test-assets:/test-assets
    depends_on:
      universal_photos-init:
        condition: service_healthy
      redis:
        condition: service_started
      database:
        condition: service_healthy

  universal_photos-web:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: universal_photos-web
    container_name: universal_photos-e2e-web
    ports: !override
      - 2285:3000
    environment:
      UNIVERSALPHOTOS_SERVER_URL: http://universal_photos-server:2285/
    depends_on:
      universal_photos-init:
        condition: service_healthy
    restart: unless-stopped

  redis:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: redis
    container_name: universal_photos-e2e-redis

  database:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: database
    container_name: universal_photos-e2e-postgres
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    env_file: !reset []
    ports: !override
      - 5435:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: universal_photos
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d universal_photos']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  model_cache:
  prometheus_data:
  grafana_data:
  build_cache:
  server_node_modules:
  web_node_modules:
  github_node_modules:
  cli_node_modules:
  docs_node_modules:
  e2e_node_modules:
  sdk_node_modules:
  app_node_modules:
  sveltekit:
  coverage:
